<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {box-sizing: border-box;}

body { 
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  /*background-color: #EAF5DF;*/
}

header {
  /*background-color: #EAF5DF;*/
}

.header_container {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
    padding: 20px 50px;
}

.logo_part {
    display: flex;
    justify-self: center;
    /*justify-content: center;*/
}

.logo_part a img{
        width: 100px;    
}

.nav_part {
    justify-self: center;
}

.header_actions {
    justify-self: center;
    display: flex;
    align-items: center;
    gap: 15px;
}
header a {
  color: #83c03f;
  text-align: center;
  padding: 12px;
  text-decoration: none;
  font-size: 18px; 
  line-height: 60px;
  border-radius: 4px;
  height: 100px;
}

header a:hover {
  color: #476B49;
}
/*
.header a.active {
  background-color: dodgerblue;
  color: white;
}
*/

.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown_menu {
    display: none; /* caché par défaut */
    position: absolute;
    top: 100%; /* juste en dessous du <a> */
    left: 0;
    background-color: #fff;
    list-style: none;
    margin: 0;
    padding: 0;
    min-width: 100px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    z-index: 10;
}

.dropdown_menu li {
    text-align: left;
}

.dropdown_menu li a {
    display: block;
    padding: 8px 12px;
    color: #83c03f;
    text-decoration: none;
    font-size: 16px;
    line-height: normal; /* évite le line-height: 60px hérité de "header a" */
    height: auto; /* pareil, pour ignorer le height: 100px hérité */
}

.dropdown_menu li a:hover {
    background-color: #EAF5DF;
}


.dropdown a {
    display: flex;
    align-items: center;
    gap: 8px;
}

.dropdown a img {
    display: flex;
    align-items: center;
    gap: 8px;
}

.dropdown_menu li a {
    display: flex;
    align-items: center;
    gap: 8px;
}

.dropdown_menu li a img {
    display: block;
    width: 20px;
    height: auto;
}


.container {
  display: none;
  cursor: pointer;
}

.bar1, .bar2, .bar3 {
  width: 25px;
  height: 3px;
  background-color: #83c03f;
  margin: 5px 0;
  transition: 0.4s;
}

.change .bar1 {
  transform: translate(0 , 8px) rotate(-45deg);
}

.change .bar2 {opacity: 0;}

.change .bar3 {
  transform: translate(0, -8px) rotate(45deg);
}

.menu_button{
    display: none;
    /*background-color: #EAF5DF;*/
}



@media screen and (max-width: 800px) {
    .header_container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 10vh;
        padding: 15px 20px;
        box-sizing: border-box;
        position: relative;
    }

    .header_actions {
        display: flex;
        align-items: center;
    }

    .menu_button {
        display: inline-block;
    }

    .logo_part {
        display: flex;
        justify-content: flex-start;
        align-items: center;
    }

    .logo_part a {
        display: flex;
        align-items: center;    /* Centers vertically */
        justify-content: center;
    }

    .logo_part a img{
        width: 50px;
    }

    .nav_part {
        display: none;
        left: 0;
        width: 100%;
        flex-direction: column;
        align-items: center;
        position: absolute;
        top: 100%;
        background-color: #f8f9fa;
    }

    .nav_part.active {
        display: flex;
    }

    .dropdown .dropdown_menu {
        display: none;
    }

    .dropdown.open .dropdown_menu {
        display: block;
    }

}
</style>
<script>
    function switchToFrench(){
        document.getElementById("languageOfTheWebsite").textContent = "FR"
        document.getElementById("flagLanguageWebsite").src = "flag-for-flag-france-svgrepo-com.svg"
        closeLanguageMenu();
    };

    function switchToEnglish(){
        document.getElementById("languageOfTheWebsite").textContent = "EN"
        document.getElementById("flagLanguageWebsite").src = "flag-for-flag-united-kingdom-svgrepo-com.svg"
        closeLanguageMenu();
    };

    function switchToDutch(){
        document.getElementById("languageOfTheWebsite").textContent = "NL"
        document.getElementById("flagLanguageWebsite").src = "flag-for-flag-netherlands-svgrepo-com.svg"
        closeLanguageMenu();
    };

    function toggleMenu(x) {
        x.classList.toggle("change");
        var navPart = document.querySelector('.nav_part');
        if (navPart.style.display === "flex") {
            navPart.style.display = "none";
        } else {
            navPart.style.display = "flex";
        }
    }

    function toggleLanguageMenu() {
        var dropdownMenu = document.querySelector('.dropdown_menu');
        if (dropdownMenu.style.display === "block") {
            dropdownMenu.style.display = "none";
        } else {
            dropdownMenu.style.display = "block";
        }
    }

    function closeLanguageMenu() {
        var dropdownMenu = document.querySelector('.dropdown_menu');
        if (dropdownMenu.style.display === "block") {
            dropdownMenu.style.display = "none";
        } else {
            dropdownMenu.style.display = "block";
        }
    }

    document.addEventListener('click', function(event) {
        var dropdown = document.querySelector('.dropdown');
        if (!dropdown.contains(event.target)) {
            document.querySelector('.dropdown_menu').style.display = "none";
        }
    });
</script>
</head>
<body>
    <header>
        <div class="header_container">
            <div class="logo_part">
                <a href="#" class="logo"><img src="Logo sans titre transparent.png" alt="logo"></a>
            </div>
            <div class="nav_part">
                <a class="active" href="#">Accueil</a>
                <a href="#">Produits</a>
                <a href="#">Promotion</a>
                <a href="#">Contact</a>
            </div>
            <div class="header_actions">
                <div class="language_part">
                    <div class="dropdown">
                        <a onclick="toggleLanguageMenu()">
                            <img src="flag-for-flag-france-svgrepo-com.svg" alt="Flag" width="20" id="flagLanguageWebsite">
                            <span id="languageOfTheWebsite">FR</span>
                        </a>
                        <ul class="dropdown_menu">
                            <li><a  onclick="switchToFrench()"><img src="flag-for-flag-france-svgrepo-com.svg" alt="Français" width="20"> FR</a></li>
                            <li><a  onclick="switchToEnglish()"><img src="flag-for-flag-united-kingdom-svgrepo-com.svg" alt="Anglais" width="20"> EN</a></li>
                            <li><a  onclick="switchToDutch()"><img src="flag-for-flag-netherlands-svgrepo-com.svg" alt="Néerlandais" width="20"> NL</a></li>
                        </ul>
                    </div>
                </div>
                <div class="menu_button" onclick="toggleMenu(this)">
                    <div class="bar1"></div>
                    <div class="bar2"></div>
                    <div class="bar3"></div>
                </div>
            </div>
        </div>
    </header>
