.header_container {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
    padding: 20px 50px;
}

.logo_part {
    justify-self: center;
    display: flex;
    justify-content: center;
}

.nav_part {
    justify-self: center;
}

.header_actions {
    justify-self: center;
    display: flex;
    align-items: center;
    gap: 15px;
}
header a {
  color: #83c03f;
  text-align: center;
  padding: 12px;
  text-decoration: none;
  font-size: 18px; 
  line-height: 60px;
  border-radius: 4px;
  height: 100px;
}

header a:hover {
  color: #476B49;
}
/*

  background-color: dodgerblue;
  color: white;

.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown_menu {
    display: none; /* caché par défaut */
    position: absolute;
    top: 100%; /* juste en dessous du <a> */
    left: 0;
    background-color: #fff;
    list-style: none;
    margin: 0;
    padding: 0;
    min-width: 100px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    z-index: 10;
}

.dropdown_menu li {
    text-align: left;
}

.dropdown_menu li a {
    display: block;
    padding: 8px 12px;
    color: #83c03f;
    text-decoration: none;
    font-size: 16px;
    line-height: normal; /* évite le line-height: 60px hérité de "header a" */
    height: auto; /* pareil, pour ignorer le height: 100px hérité */
}

.dropdown_menu li a:hover {
    background-color: #EAF5DF;
}

.dropdown:hover .dropdown_menu {
    display: block; /* apparaît au survol */
}

.dropdown a {
    display: flex;
    align-items: center;
    gap: 8px;
}

.dropdown a img {
    display: flex;
    align-items: center;
    gap: 8px;
}

.dropdown_menu li a {
    display: flex;
    align-items: center;
    gap: 8px;
}

.dropdown_menu li a img {
    display: block;
    width: 20px;
    height: auto;
}

.menu_button{
    display: none;
    background-color: #EAF5DF;
}

@media screen and (max-width: 800px) {
    .header_container {
        padding: 10px 20px;
        margin-left: 0px;
        margin-right: 0px;
    }

    .header_actions {
        display: flex;
        align-items: center;
        background-color: red;
        place-items: end;
    }

    .nav_part {
        display: none;
    }

    .menu_button {
        display: block;
    }
}
</style>
<script>
    function switchToFrench(){
        document.getElementById("languageOfTheWebsite").textContent = "FR"
        document.getElementById("flagLanguageWebsite").src = "flag-for-flag-france-svgrepo-com.svg"
    };

    function switchToEnglish(){
        document.getElementById("languageOfTheWebsite").textContent = "EN"
        document.getElementById("flagLanguageWebsite").src = "flag-for-flag-united-kingdom-svgrepo-com.svg"
    };

    function switchToDutch(){
        document.getElementById("languageOfTheWebsite").textContent = "NL"
        document.getElementById("flagLanguageWebsite").src = "flag-for-flag-netherlands-svgrepo-com.svg"
    };
</script>

<body>
    <header>
        <div class="header_container">
            <div class="logo_part">
                <a href="#" class="logo"><img src="Logo sans titre transparent.png" alt="logo" width="100px"></a>
            </div>
            <div class="nav_part">
                <a class="active" href="#">Accueil</a>
                <a href="#">Produits</a>
                <a href="#">Promotion</a>
                <a href="#">Contact</a>
            </div>
            <div class="header_actions">
                <div class="language_part">
                    <div class="dropdown">
                        <a  onclick="clickChangeLanguage()">
                            <img src="flag-for-flag-france-svgrepo-com.svg" alt="Flag" width="20" id="flagLanguageWebsite">
                            <span id="languageOfTheWebsite">FR</span>
                        </a>
                        <ul class="dropdown_menu">
                            <li><a  onclick="switchToFrench()"><img src="flag-for-flag-france-svgrepo-com.svg" alt="Français" width="20"> FR</a></li>
                            <li><a  onclick="switchToEnglish()"><img src="flag-for-flag-united-kingdom-svgrepo-com.svg" alt="Anglais" width="20"> EN</a></li>
                            <li><a  onclick="switchToDutch()"><img src="flag-for-flag-netherlands-svgrepo-com.svg" alt="Néerlandais" width="20"> NL</a></li>
                        </ul>
                    </div>
                </div>
                <button class="menu_button" onclick="toggleMenu()" aria-label="Ouvrir le menu">
                    ☰
                </button>
            </div>
        </div>
    </header>
